<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <link href="../css/global.css" rel="stylesheet"/>
  <link href="../css/sign_up.css" rel="stylesheet"/>
  <link href="../css/index_style.css" rel="stylesheet"/>
</head>
<body>
<div class="content-area">
  <div class="overlap">
    <div class="text-wrapper">Log in</div>
    <div class="div">Already have an account?</div>
    <div class="sign-in">
      <div class="overlap-group">
        <div class="overlap-2">
          <div class="apple">
            <div class="overlap-group-2">
              <div class="rectangle"></div>
              <img class="image" src="../img/image-10.PNG"/>
            </div>
          </div>
          <div class="google"><img class="img" src="../img/image-9.PNG"/></div>
          <div class="text-wrapper-2">Or Register With</div>
        </div>
        <div class="facebook"><img class="image-2" src="../img/image-8.PNG"/></div>
      </div>
      <div class="vector" data-layer="Vector 1" data-svg-wrapper>
        <svg fill="none" height="2" viewBox="0 0 290 2" width="290" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 1C61.6856 1 219.036 1 290 1" stroke="black"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="sign-up-box">
    <button class="sign-up-btn" id="signUpBtn">SIGN UP</button>
    <p id="error-message" style="color: red; display: none;"></p>
  </div>


  <div class="check-box">
    <label class="checkbox-label">
      <input id="terms-checkbox" type="checkbox">
      <span class="custom-checkbox"></span>
      <p class="p">I accept the terms and privacy policy</p>
    </label>
  </div>
  <div class="overlap-4">
    <div class="enter-info">
      <div class="username">
        <div class="overlap-group-3">
          <input class="username-input" id="username" placeholder="Enter your username" type="text">
          <div class="rectangle-2"></div>
        </div>
        <div class="text-wrapper-5">Username</div>
        <div class="person">
          <svg fill="none" height="35" viewBox="0 0 35 35" width="35" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M17.5 17.5C21.6421 17.5 25 14.1421 25 10C25 5.85786 21.6421 2.5 17.5 2.5C13.3579 2.5 10 5.85786 10 10C10 14.1421 13.3579 17.5 17.5 17.5ZM17.5 17.5C11.9771 17.5 7.5 21.9771 7.5 27.5V30H27.5V27.5C27.5 21.9771 23.0229 17.5 17.5 17.5Z"
              stroke="#1E1E1E" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
          </svg>
        </div>
      </div>
      <div class="password">
        <div class="password-container">
          <div class="overlap-group-3">
            <input class="password-input input-password" id="password" placeholder="Enter your password"
                   type="password">
            <span class="toggle-password">👁️</span>
          </div>
        </div>

        <div class="text-wrapper-5">Password</div>
        <div class="key">
          <svg fill="none" height="35" viewBox="0 0 35 35" width="35" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M30.625 2.91666L27.7083 5.83332M27.7083 5.83332L32.0833 10.2083L26.9791 15.3125L22.6041 10.9375M27.7083 5.83332L22.6041 10.9375M16.6104 16.9312C17.3634 17.6742 17.962 18.5588 18.3717 19.5341C18.7814 20.5093 18.9942 21.556 18.9977 22.6138C19.0013 23.6717 18.7955 24.7197 18.3923 25.6977C17.9892 26.6757 17.3965 27.5643 16.6485 28.3123C15.9005 29.0603 15.0119 29.6529 14.034 30.0561C13.056 30.4593 12.0079 30.665 10.9501 30.6615C9.89223 30.6579 8.84556 30.4452 7.87029 30.0355C6.89503 29.6257 6.01045 29.0272 5.26747 28.2742C3.80641 26.7614 2.99796 24.7353 3.01623 22.6323C3.03451 20.5293 3.87805 18.5175 5.36518 17.0304C6.85231 15.5433 8.86403 14.6997 10.9671 14.6815C13.0701 14.6632 15.0962 15.4716 16.6089 16.9327L16.6104 16.9312ZM16.6104 16.9312L22.6041 10.9375"
              stroke="#1E1E1E" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
          </svg>
        </div>
      </div>

    </div>
    <img class="background" src="../img/background.PNG"/>
    <div class="text-wrapper-8">SIGN UP</div>
    <div class="text-wrapper-9">CUPID</div>
  </div>
  <!-- Thêm các phần tử mới vào đây -->
  <div class="login-footer">
    <div class="AlreadyHaveAnAccount">Already have an account?</div>
    <a class="LogIn" href="#">Log in</a>
  </div>
</div>
<script src="/Web/SE/cupid/src/js/sign_up.js" type="text/javascript"></script>

</body>
</html>

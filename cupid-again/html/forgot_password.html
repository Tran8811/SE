<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên Mật Khẩu</title>
</head>
<body>
<h2>Quên Mật Khẩu</h2>
<input type="email" id="email" placeholder="Nhập email của bạn">
<button onclick="sendOTP()">Gửi Mã Xác Nhận</button>

<div id="otpSection" style="display:none;">
  <input type="text" id="otp" placeholder="Nhập mã OTP">
  <button onclick="verifyOTP()">Xác Nhận</button>
</div>

<div id="resetSection" style="display:none;">
  <input type="password" id="newPassword" placeholder="Nhập mật khẩu mới">
  <button onclick="resetPassword()">Đặt lại mật khẩu</button>
</div>

<script>
  function sendOTP() {
    let email = document.getElementById("email").value;
    fetch("send_otp.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          alert("Mã OTP đã được gửi!");
          document.getElementById("otpSection").style.display = "block";
        } else {
          alert("Email không tồn tại!");
        }
      });
  }

  function verifyOTP() {
    let email = document.getElementById("email").value;
    let otp = document.getElementById("otp").value;
    fetch("verify_otp.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, otp })
    })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          alert("Mã OTP chính xác!");
          document.getElementById("resetSection").style.display = "block";
        } else {
          alert("Mã OTP sai!");
        }
      });
  }

  function resetPassword() {
    let email = document.getElementById("email").value;
    let newPassword = document.getElementById("newPassword").value;
    fetch("reset_password.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, newPassword })
    })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          alert("Mật khẩu đã được đặt lại!");
          window.location.href = "login.html";
        } else {
          alert("Lỗi đặt lại mật khẩu!");
        }
      });
  }
</script>
</body>
</html>

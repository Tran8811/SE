<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="styles.css"> <!-- Link file CSS -->
</head>
<body>
<div class="container">
  <h2>Forgot Password</h2>

  <!-- Bước 1: Nhập Username + Email -->
  <form id="requestOTPForm">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <button type="submit">Send OTP</button>
  </form>

  <!-- Bước 2: Nhập OTP + Mật khẩu mới -->
  <form id="resetPasswordForm" style="display: none;">
    <label for="otp">Enter OTP:</label>
    <input type="text" id="otp" name="otp" required>

    <label for="new_password">New Password:</label>
    <input type="password" id="new_password" name="new_password" required>

    <button type="submit">Reset Password</button>
  </form>

  <!-- Nút quay về Sign In -->
  <button onclick="goToSignIn()" class="back-button">Back to Sign In</button>
</div>

<script src="/cupid-again/js/script.js"></script> <!-- Link file JavaScript -->
</body>
</html>

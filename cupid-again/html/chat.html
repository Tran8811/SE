<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Box</title>
  <link href="../css/chat.css" rel="stylesheet">
  <link href="../css/global.css" rel="stylesheet">
</head>
<body>

<div class="container centered">
  <div class="puppy-logo">
    <button class="logo-btn">
      <img
        src="https://cdn.builder.io/api/v1/image/assets/TEMP/e68fd6c3f2ab1ff46421e4a7ac072d069f3385fab2f814fe93158c1166e4120a?placeholderIfAbsent=true&apiKey=900875ef9ddd4938952c98e4afe5bae0"
        class="puppy-logo-image"
        alt="Chat Logo"
      />
    </button>
    <p class="puppy-logo-text">CHAT WITH CUPID</p>
  </div>

  <!-- Thêm dropdown chọn người chat -->
  <label for="chatWith">Chọn người để chat:</label>
  <select id="chatWith">
    <option value="">Chọn người...</option>
    <!-- Danh sách user sẽ được load từ server -->
  </select>

  <!-- Hộp chat -->
  <div class="chat-box" id="chatBox">
    <!-- Tin nhắn sẽ được thêm vào đây -->
  </div>

  <!-- Ô nhập tin nhắn -->
  <div class="chat-input">
    <input type="text" id="message" placeholder="Nhập tin nhắn..." disabled>
    <button id="sendBtn" disabled>Gửi</button>
  </div>
</div>

<script defer src="../js/chat.js"></script>

</body>
</html>

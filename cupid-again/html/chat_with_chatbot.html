<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat With Cupid</title>
  <link href="../css/chat.css" rel="stylesheet" />
  <link href="../css/global.css" rel="stylesheet" />
  <style>
    /* Tuỳ chỉnh thêm nếu cần */
    .bot { background-color: #e0e0e0; padding: 10px; border-radius: 12px; margin: 5px; max-width: 70%; }
    .user { background-color: #007bff; color: white; padding: 10px; border-radius: 12px; margin: 5px; align-self: flex-end; max-width: 70%; }
    .message-container { display: flex; flex-direction: column; }
  </style>
</head>
<body>
<div class="container">
  <div class="puppy-logo">
    <button class="logo-btn" id="logo-btn">
      <img
        src="https://cdn.builder.io/api/v1/image/assets/TEMP/e68fd6c3f2ab1ff46421e4a7ac072d069f3385fab2f814fe93158c1166e4120a"
        class="puppy-logo-image"
        alt="Chat Logo"
      />
    </button>
    <p class="puppy-logo-text" id="chatTitle">CHAT WITH CUPID</p>
  </div>

  <!-- Hộp chat -->
  <div class="chat-box" id="chatBox" style="max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px;"></div>

  <!-- Ô nhập tin nhắn -->
  <div class="chat-input">
    <input type="text" id="message" placeholder="Chat anything..." />
    <button id="sendBtn">
      <svg class="send-icon" width="24" height="24" viewBox="0 0 48 48" fill="none">
        <path d="M44 4L22 26M44 4L30 44L22 26M44 4L4 18L22 26"
              stroke="#1E1E1E"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"></path>
      </svg>
    </button>
  </div>
</div>

<!--<script src="https://cdn.socket.io/4.3.2/socket.io.min.js"></script>-->
<script>
  const input = document.getElementById("message");
  const sendBtn = document.getElementById("sendBtn");
  const chatBox = document.getElementById("chatBox");

  let currentUserId = null;

  window.addEventListener("DOMContentLoaded", async () => {
    try {
      const res = await fetch("../php/match_api.php");
      const data = await res.json();

      if (data.userId) {
        currentUserId = data.userId;
        console.log("User ID:", currentUserId);
      } else {
        alert("Bạn chưa đăng nhập!");
        window.location.href = "../php/login.php";
      }
    } catch (err) {
      console.error("Lỗi khi lấy userId:", err);
    }
  });

  sendBtn.addEventListener("click", sendQuery);
  input.addEventListener("keypress", function (e) {
    if (e.key === "Enter") sendQuery();
  });


  async function sendQuery() {
    const query = input.value.trim();
    if (!query) return;

    // Hiển thị tin nhắn người dùng
    const userMsg = document.createElement("div");
    userMsg.className = "message-container user";
    userMsg.textContent = query;
    chatBox.appendChild(userMsg);
    chatBox.scrollTop = chatBox.scrollHeight;

    input.value = "";

    try {
      const response = await fetch("http://127.0.0.1:8080/answer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: query, userId: currentUserId})
      });

      const data = await response.json();
      let botReply = data.answer || "Không có dữ liệu";
      if (data.filter && typeof data.filter === 'object') {
        botReply += " Danh sách người dùng đã được cập nhật. Vui lòng kiểm tra trang Show Users!";
      }

      const botMsg = document.createElement("div");
      botMsg.className = "message-container bot";
      botMsg.textContent = botReply;
      chatBox.appendChild(botMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

    } catch (error) {
      console.error("[ERROR] Gửi yêu cầu thất bại:", error.message);
    }
  }

  // Điều hướng logo
  document.getElementById("logo-btn").addEventListener("click", function () {
    window.location.href = "../php/chat.php";
  });
</script>
</body>
</html>

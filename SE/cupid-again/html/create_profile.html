<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Profile - CUPID</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/edit_profile.css">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
</head>
<body>
<div class="container centered">
  <h2 class="title">Let's get started with...</h2>

  <form id="create-profile-form" enctype="multipart/form-data" data-user-id="">
    <div class="user-info">
      <!-- Tên -->
      <label for="username">Your name:</label>
      <input type="text" id="username" name="username" placeholder="Enter your username" required>

      <!-- Tuổi -->
      <label for="age">Age:</label>
      <input type="number" id="age" name="age" placeholder="Enter your age" required>

      <!-- Giới tính -->
      <label>Gender:</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="male" required> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
        <label><input type="radio" name="gender" value="other"> Other</label>
      </div>

      <!-- Sở thích giới tính -->
      <label>Interested in:</label>
      <div class="radio-group">
        <label><input type="radio" name="interests" value="male" required> Men</label>
        <label><input type="radio" name="interests" value="female"> Women</label>
        <label><input type="radio" name="interests" value="both"> Both</label>
      </div>

      <!-- Avatar -->
      <input type="file" id="avatar-input" accept="image/*">

      <!-- Avatar hiện tại -->
      <img id="user-avatar" src="../img/logo.png" alt="Avatar" width="150" height="150" style="border-radius: 50%;">

      <!-- Popup Modal Crop -->
      <div id="crop-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
        <div style="background: white; padding: 20px; border-radius: 10px; text-align: center;">
          <h3>Cắt ảnh</h3>
          <div style="width: 300px; height: 300px;">
            <img id="crop-image" style="max-width: 100%;">
          </div>
          <br>
          <button id="crop-ok">OK</button>
          <button id="crop-cancel">Hủy</button>
        </div>
      </div>
    </div>

    <div class="buttons">
      <button type="submit" class="save-btn">Create</button>
    </div>
  </form>
</div>

<script src="../js/edit_profile.js"></script>
</body>
</html>

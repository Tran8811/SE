<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Box</title>
  <link href="../css/chat.css" rel="stylesheet">
  <link href="../css/global.css" rel="stylesheet">
</head>
<body>

<div class="container">
  <div class="puppy-logo">
    <button class="logo-btn" id="logo-btn">
      <img
        src="https://cdn.builder.io/api/v1/image/assets/TEMP/e68fd6c3f2ab1ff46421e4a7ac072d069f3385fab2f814fe93158c1166e4120a?placeholderIfAbsent=true&apiKey=900875ef9ddd4938952c98e4afe5bae0"
        class="puppy-logo-image"
        alt="Chat Logo"
      />
    </button>
    <p class="puppy-logo-text" id="chatTitle">CHAT WITH CUPID</p>
  </div>
  <!-- Hộp chat -->
  <div class="chat-box" id="chatBox">
    <!-- Tin nhắn sẽ được thêm vào đây -->
  </div>
  <!-- Ô nhập tin nhắn -->
  <div class="chat-input">
    <input type="text" id="message" placeholder="Chat anything...">
    <button id="sendBtn" disabled>
      <svg
        class="send-icon"
        width="24"
        height="24"
        viewBox="0 0 48 48"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M44 4L22 26M44 4L30 44L22 26M44 4L4 18L22 26"
          stroke="#1E1E1E"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></path>
      </svg>
    </button>
  </div>
</div>

<script src="https://cdn.socket.io/4.3.2/socket.io.min.js"></script>
<script>
  document.getElementById("logo-btn").addEventListener("click", function () {
    window.location.href = "../php/chat.php";
  });
</script>
</body>
</html>

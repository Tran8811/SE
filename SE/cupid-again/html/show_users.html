<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUPID</title>
  <link rel="stylesheet" href="../css/show_users.css">
</head>
<body>
<div class="container">
  <h1 class="title">Find a partner here!</h1>
  <div class="user-list" id="user-list">
    <!-- Các user card sẽ được tạo động từ API -->
  </div>
</div>

<!-- Popup chi tiết người dùng -->
<div id="popup" class="popup">
  <div class="popup-content">
    <span class="close-btn" onclick="closePopup()">&times;</span>
    <img id="popup-avatar" src="" alt="Avatar" class="user-avatar">
    <h2 id="popup-name"></h2>
    <p id="popup-mbti"></p>
    <p id="popup-age"></p>
    <p id="popup-gender"></p>
    <button id="chat-btn">Bắt đầu chat</button>
  </div>
</div>

<script>
  // Lấy userId từ sessionStorage hoặc cookie
  const userId = sessionStorage.getItem("userId") || localStorage.getItem("userId") || prompt("Nhập ID của bạn:");
  sessionStorage.setItem("userId", userId);

  if (!userId) {
    console.error("Lỗi: Không tìm thấy userId trong sessionStorage");
  } else {
    console.log("DEBUG - User ID từ sessionStorage:", userId);
  }

  // Hàm mở popup
  let targetUserId = null; // Biến toàn cục để lưu ID của người nhận

  function openPopup(id, name, mbti, age, gender, avatar) {
    targetUserId = id; // Lưu ID của người nhận
    document.getElementById("popup-name").innerText = name;
    document.getElementById("popup-mbti").innerText = `MBTI: ${mbti}`;
    document.getElementById("popup-age").innerText = `Tuổi: ${age}`;
    document.getElementById("popup-gender").innerText = `Giới tính: ${gender}`;

    if (avatar) {
      document.getElementById("popup-avatar").src = avatar;
    } else {
      console.warn("Lỗi: Avatar bị thiếu!");
      document.getElementById("popup-avatar").src = "../img/default-avatar.png"; // Avatar mặc định nếu thiếu
    }

    document.getElementById("popup").style.display = "flex";
    document.getElementById("popup").classList.add("show");

    const chatBtn = document.getElementById("chat-btn");
    const currentChat = sessionStorage.getItem("currentChat");

    if (currentChat) {
      chatBtn.innerText = "Đang chat với " + currentChat;
      chatBtn.disabled = true;
    } else {
      chatBtn.innerText = "Bắt đầu chat";
      chatBtn.disabled = false;
      chatBtn.onclick = () => sendChatRequest(targetUserId);
    }
  }

  // Hàm gửi lời mời chat
  function sendChatRequest(receiverId) {
    if (!receiverId) {
      console.error("Lỗi: Không có ID người nhận!");
      return;
    }

    if (receiverId === userId) {
      alert("Lỗi: Không thể gửi lời mời chat cho chính mình!");
      return;
    }

    console.log("DEBUG - Gửi chat request từ userId:", userId, "đến receiverId:", receiverId);

    fetch("../php/send_notifications.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        type: "chat_request",
        sender_id: userId,
        receiver_id: receiverId
      })
    })
      .then(res => res.json())
      .then(data => {
        console.log("DEBUG - Phản hồi từ server:", data);
        if (data.status === "success") {
          document.getElementById("chat-btn").innerText = "Đã gửi lời mời";
          document.getElementById("chat-btn").disabled = true;
        } else {
          alert(data.message);
        }
      })
      .catch(err => console.error("Lỗi gửi lời mời:", err));
  }

  function closePopup() {
    document.getElementById("popup").classList.remove("show");
    setTimeout(() => {
      document.getElementById("popup").style.display = "none";
    }, 300); // Chờ hiệu ứng đóng
  }

  // Lấy dữ liệu người dùng từ API
  function loadUsers() {
    const userListContainer = document.getElementById("user-list");
    userListContainer.innerHTML = "Đang tải...";  // Hiển thị thông báo đang tải

    fetch(`/cupid-again/php/match_api.php?id=${userId}`, {
      method: "GET",
      headers: {
        "Authorization": "Basic " + btoa("admin:123456"), // Mã hóa user:password
        "Content-Type": "application/json"
      }
    })
      .then(response => response.json())
      .then(data => {
        userListContainer.innerHTML = '';  // Xóa thông báo "loading"

        data.forEach(user => {
          const userCard = document.createElement('div');
          userCard.classList.add('user-card');
          userCard.style.backgroundColor = user.backgroundColor || '#d3d3d3';
          userCard.setAttribute('onclick', `openPopup(${user.id}, '${user.username}', '${user.mbti}', ${user.age}, '${user.gender}', '${user.avatar || '../img/default-avatar.png'}')`);

          userCard.innerHTML = `
          <img src="../img/${user.avatar || 'default-avatar.png'}" alt="avatar" class="user-avatar">
          <div class="user-info">
            <h2>${user.username}</h2>
            <p>MBTI: ${user.mbti}</p>
          </div>
        `;
          userListContainer.appendChild(userCard);
        });
      })
      .catch(error => console.error('Lỗi khi tải dữ liệu:', error));
  }

  // Gọi hàm loadUsers khi trang được tải
  window.onload = loadUsers;
</script>
</body>
</html>

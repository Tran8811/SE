<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@400;700&family=Inria+Serif:wght@400&family=Kings&display=swap"
    rel="stylesheet"
  />
  <link href="/cupid/src/css/sign_in_style.css" rel="stylesheet"/>
  <title>CUPID</title>
</head>
<body>
<main class="container">

  <div class="background-shape"></div>
  <img alt="sign in logo" class="signin-image" src="/cupid/src/img/sign_in.PNG">
  <img alt="heart" class="heart-image" src="/cupid/src/img/heart.png">
  <img alt="message logo" class="message-image" src="/cupid/src/img/message.PNG">

  <div class="content">
    <h1 class="title">SIGN<br>IN</h1>
    <form class="form">
      <div class="input-group">
        <label class="label" for="username">Username</label>
        <div class="input-container">
          <input class="input-field" id="username" placeholder="Enter your username" type="text"/>
        </div>
      </div>
      <div class="input-group">
        <label class="label" for="password">Password</label>
        <div class="input-container">
          <input class="input-field" id="password" placeholder="Enter your password" type="password"/>
        </div>
      </div>
      <button class="sign-in-button" type="submit">SIGN IN</button>
      <p class="signup-text">
        Don't have an account?
        <a class="signup-link" href="#">Sign up now</a>
      </p>
    </form>
  </div>
</main>

<!-- Liên kết file JavaScript -->
<script src="/cupid/src/js/sign_in.js"></script>

</body>
</html>
